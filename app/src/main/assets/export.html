<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwiftTV · 导出诊断</title><style>
:root{color-scheme:dark}body{margin:0;background:#07090d;color:#f6f8fc;font:16px "PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:520px;margin:60px auto;padding:24px}h1{font-weight:600;font-size:34px;letter-spacing:-.8px;margin-top:8px}small,p{color:#949eb0;line-height:1.85}button{background:#f3f6fb;color:#0a0d13;border:0;border-radius:999px;font:600 15px inherit;padding:16px 24px;cursor:pointer;width:100%;margin:24px 0}button:focus-visible{outline:2px solid #f6f8fc;outline-offset:4px}pre{white-space:pre-wrap;color:#949eb0;font-size:14px}
</style><main><div style="font-size:12px;color:#647084">SwiftTV · 本机诊断</div><h1>诊断，保存在你手中。</h1><p>报告包含频道名称、设备型号、首帧时间和播放错误。完整线路路径、查询参数与请求头均已脱敏。</p><button id="download">下载诊断 JSON ↓</button><pre id="status" role="status"></pre><small>五分钟后此页面连接自动关闭。</small></main><script>
(function(){const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);const button=document.getElementById('download'),status=document.getElementById('status');button.disabled=!token;button.onclick=async function(){button.disabled=true;try{const r=await fetch('/api/diagnostics',{headers:{'X-SwiftTV-Token':token}});if(!r.ok)throw new Error('配对已失效，请重新扫描电视二维码');const blob=new Blob([await r.text()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='swifttv-diagnostics.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='诊断文件已生成。'}catch(e){status.textContent=e.message}finally{button.disabled=false}};if(!token)status.textContent='请从电视上的二维码打开此页面。'})();
</script></html>
